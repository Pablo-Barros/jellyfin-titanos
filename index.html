<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Jellyfin for Titan OS</title>
<script src="https://sdk.titanos.tv/sdk/sdk.js" async></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
  <header class="brand">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
      <defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="110.25" y1="213.3" x2="496.14" y2="436.09">
        <stop offset="0" stop-color="#aa5cc3"/><stop offset="1" stop-color="#00a4dc"/></linearGradient></defs>
      <path fill="url(#g)" d="M256,201.6c-20.4,0-86.2,119.3-76.2,139.4s142.5,19.9,152.4,0S276.5,201.6,256,201.6z"/>
      <path fill="url(#g)" d="M256,23.3c-61.6,0-259.8,359.4-229.6,420.1s429.3,60,459.2,0S317.6,23.3,256,23.3z M406.5,390.8c-19.6,39.3-281.1,39.8-300.9,0s110.1-275.3,150.4-275.3S426.1,351.4,406.5,390.8z"/>
    </svg>
    <h1>Jellyfin</h1>
    <p class="tag" data-i18n="tagline">Unofficial client for Titan OS</p>
  </header>

  <section id="servers-view" class="view">
    <h2 data-i18n="yourServers">Your servers</h2>
    <ul id="server-list" class="server-list"></ul>
    <button id="add-server" class="focusable btn" data-i18n="addServer">+ Add server</button>
  </section>

  <section id="add-view" class="view hidden">
    <h2 data-i18n="addServerTitle">Add server</h2>
    <label for="server-input" data-i18n="serverAddress">Server address</label>
    <input id="server-input" class="focusable" type="url" inputmode="url" autocomplete="off" spellcheck="false"
           placeholder="http://192.168.1.10:8096">
    <p class="hint" data-i18n="hint">Enter the IP or domain of your Jellyfin server. Port 8096 is tried if none is given.</p>
    <p id="add-error" class="error" role="alert"></p>
    <div class="row">
      <button id="connect" class="focusable btn primary" data-i18n="connect">Connect</button>
      <button id="cancel-add" class="focusable btn" data-i18n="cancel">Cancel</button>
    </div>
  </section>

  <section id="loading-view" class="view hidden">
    <div class="spinner" aria-hidden="true"></div>
    <p id="loading-text" data-i18n="connecting">Connecting…</p>
    <button id="cancel-loading" class="focusable btn" data-i18n="cancel">Cancel</button>
  </section>
</main>

<div id="exit-dialog" class="dialog hidden" role="dialog" aria-modal="true" aria-labelledby="exit-title">
  <div class="dialog-box">
    <h2 id="exit-title" data-i18n="exitQuestion">Do you want to exit?</h2>
    <div class="row">
      <button id="exit-yes" class="focusable btn primary" data-i18n="exit">Exit</button>
      <button id="exit-no" class="focusable btn" data-i18n="cancel">Cancel</button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
